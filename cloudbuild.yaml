# Build the backend image, push it to Artifact Registry and deploy it to Cloud Run.
# Build the static Next.js frontend and deploy it to Firebase Hosting.
substitutions:
  _REGION: asia-south1
  _SERVICE: ajay-dpr
  _REPO: cloud-run-source-deploy
  _FIREBASE_PROJECT: dpr-frontend-badcf

steps:
  # --- Backend Steps ---
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - -f
      - dpr-backend/Dockerfile
      - dpr-backend

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=2Gi
      - --cpu=2
      - --timeout=900
      - --concurrency=10
      - --min-instances=1
      - --max-instances=1
      - --no-cpu-throttling
      - --cpu-boost
      - --execution-environment=gen2

  # --- Frontend Steps ---
  - id: frontend-install
    name: node:20
    dir: dpr-frontend
    entrypoint: npm
    args: ["ci"]

  - id: frontend-build
    name: node:20
    dir: dpr-frontend
    entrypoint: npm
    args: ["run", "build"]
    env:
      - "NEXT_PUBLIC_API_URL=https://ajay-dpr-779289230442.asia-south1.run.app"
      - "NEXT_PUBLIC_API_BASE_URL=https://ajay-dpr-779289230442.asia-south1.run.app"

  - id: frontend-deploy
    name: node:22
    dir: dpr-frontend
    entrypoint: npx
    args:
      - --yes
      - firebase-tools@latest
      - deploy
      - --only
      - hosting
      - --project
      - ${_FIREBASE_PROJECT}
      - --non-interactive
      - --debug

options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE
  machineType: E2_HIGHCPU_8

timeout: 1800s
