services:
  # ========== BACKEND - Python FastAPI Docker ==========
  - type: web
    name: dpr-backend
    runtime: docker
    plan: free
    rootDir: dpr-backend
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 5000
      - key: SECRET_KEY
        value: vkf_dpr_studio_super_secret_jwt_key_2026_prod
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
