name: Deploy frontend to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - "dpr-frontend/**"
      - ".github/workflows/firebase-hosting.yml"
  pull_request:
    paths:
      - "dpr-frontend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dpr-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dpr-frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      # Live deploy on push to main
      - name: Deploy to live channel
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DETAILED_PROJECT_REPORT }}
          projectId: detailed-project-report
          channelId: live
          entryPoint: dpr-frontend

      # Preview URL on pull requests
      - name: Deploy preview channel
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DETAILED_PROJECT_REPORT }}
          projectId: detailed-project-report
          entryPoint: dpr-frontend
